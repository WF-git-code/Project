#my.conf配置文件

#ip地址
ip 127.0.0.1

#端口
port 6000

#监听队列大小
lismax 1024

#线程池配置
#核心线程数
corethreadnum 4
#最大线程数
maxthreadnum 17
#任务队列大小
taskmax 1024
#任务等待时间(微秒)
taskwaittime 10
#线程空闲等待时间(秒)
threadwaittime 10

#日志清理配置
#是否启用日志清理(0:禁用, 1:启用)
enablelogclean 1
#日志保留天数
logkeepdays 7
#日志文件目录
logdir ./

#数据库配置
#数据库地址
dbhost 127.0.0.1
#数据库端口
dbport 3306
#数据库名称
dbname epoll_project
#数据库用户
dbuser root
#数据库密码
dbpassword 211929
#连接池大小
dbpoolsize 8

#Redis配置
#Redis地址
redishost 127.0.0.1
#Redis端口
redisport 6379
#Redis密码(空表示不需要密码)
redispassword 
#Redis连接池大小
redispoolsize 4
#Redis缓存过期时间(秒)
redisttl 300
